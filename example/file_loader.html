<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosh - Загрузчик схем из файлов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        h2 {
            color: #555;
            margin: 30px 0 20px;
            font-size: 1.5em;
        }

        .schema-selector {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .schema-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .schema-button {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .schema-button:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .schema-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .form-container {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #666;
            font-size: 0.95em;
        }

        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .schema-preview {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .schema-preview pre {
            margin: 0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .action-box {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .action-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Form styles */
        #form-mount-point {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        #form-mount-point fieldset {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #form-mount-point legend {
            padding: 0 10px;
            font-weight: 600;
            color: #495057;
        }

        #form-mount-point .field-group {
            margin-bottom: 20px;
        }

        #form-mount-point label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 500;
        }

        #form-mount-point input[type="text"],
        #form-mount-point input[type="email"],
        #form-mount-point input[type="number"],
        #form-mount-point input[type="date"],
        #form-mount-point input[type="url"],
        #form-mount-point textarea,
        #form-mount-point select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        #form-mount-point input:focus,
        #form-mount-point textarea:focus,
        #form-mount-point select:focus {
            outline: 0;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        #form-mount-point .radio-group,
        #form-mount-point .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        #form-mount-point .radio-item,
        #form-mount-point .checkbox-item {
            display: flex;
            align-items: center;
        }

        #form-mount-point input[type="radio"],
        #form-mount-point input[type="checkbox"] {
            margin-right: 5px;
        }

        #form-mount-point .field-description {
            font-size: 0.875em;
            color: #6c757d;
            margin-top: 5px;
        }

        #form-mount-point .field-error {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 5px;
        }

        #form-mount-point button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        #form-mount-point button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        #form-mount-point button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #form-mount-point .form-status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        #form-mount-point .form-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #form-mount-point .form-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { main } from "../build/dev/javascript/gleam_formosh/example/main.mjs";
        main();
    </script>
</body>
</html>
