<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosh - JSON Schema Form Generator</title>
    <style>
        :root {
            --primary-color: #5e72e4;
            --secondary-color: #f4f5f7;
            --error-color: #f5365c;
            --success-color: #2dce89;
            --text-color: #32325d;
            --label-color: #525f7f;
            --border-color: #dee2e6;
            --border-radius: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 600px;
        }

        .formosh-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .formosh-header {
            margin-bottom: 30px;
        }

        .formosh-title {
            color: var(--text-color);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .formosh-description {
            color: var(--label-color);
            font-size: 14px;
            line-height: 1.6;
        }

        .formosh-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .formosh-field-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .formosh-label {
            color: var(--label-color);
            font-size: 14px;
            font-weight: 500;
        }

        .formosh-required {
            color: var(--error-color);
        }

        .formosh-input,
        .formosh-textarea,
        .formosh-select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        .formosh-input:focus,
        .formosh-textarea:focus,
        .formosh-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(94, 114, 228, 0.1);
        }

        .formosh-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .formosh-radio-group,
        .formosh-checkbox-group {
            display: flex;
            gap: 16px;
        }

        .formosh-radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .formosh-radio-item input[type="radio"],
        .formosh-checkbox-group input[type="checkbox"] {
            margin: 0;
        }

        .formosh-radio-item label {
            color: var(--text-color);
            font-size: 14px;
        }

        .formosh-help {
            color: var(--label-color);
            font-size: 12px;
            line-height: 1.5;
        }

        .formosh-field-error .formosh-input,
        .formosh-field-error .formosh-textarea,
        .formosh-field-error .formosh-select {
            border-color: var(--error-color);
        }

        .formosh-errors {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .formosh-error {
            color: var(--error-color);
            font-size: 12px;
        }

        .formosh-footer {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .formosh-submit,
        .formosh-reset {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .formosh-submit {
            background: var(--primary-color);
            color: white;
        }

        .formosh-submit:hover:not(:disabled) {
            background: #4c63d2;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(94, 114, 228, 0.3);
        }

        .formosh-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .formosh-reset {
            background: var(--secondary-color);
            color: var(--text-color);
        }

        .formosh-reset:hover:not(:disabled) {
            background: #e6e8eb;
        }

        .formosh-success {
            background: var(--success-color);
            color: white;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }

        .formosh-error-message {
            background: var(--error-color);
            color: white;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- 
    To run different demos, build and import the appropriate module:
    
    1. Contact Form:
       gleam run -m lustre/dev start --entry=example/demo_contact
       
    2. Registration Form:
       gleam run -m lustre/dev start --entry=example/demo_registration
       
    3. Survey Form:
       gleam run -m lustre/dev start --entry=example/demo_survey
    -->
    
    <script type="module">
        // The module will be generated based on which demo you run
        // Default: import the generated bundle
        import "../priv/static/example/demo_contact.mjs";
    </script>
</body>
</html>
