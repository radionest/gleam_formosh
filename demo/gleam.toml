name = "demo"
version = "1.0.0"
description = "Formosh demo — picks a JSON Schema and renders it with <formosh-form>"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
formosh = { path = ".." }
rsvp = ">= 1.1.3 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 1.9.2 and < 2.0.0"

# Versions in manifest.toml are seeded from the library's manifest.toml on
# purpose: glisten 8.0.3 calls list.range / result.unwrap_both, both removed
# from gleam_stdlib >= 0.62. If you regenerate manifest.toml from scratch
# (`rm manifest.toml && gleam deps download`), `gleam build` will fail.
# When lustre_dev_tools ships a glisten fix, regenerate freely.
