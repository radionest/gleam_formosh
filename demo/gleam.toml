name = "demo"
version = "1.0.0"
description = "Formosh demo — picks a JSON Schema and renders it with <formosh-form>"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
# lustre 5.7+ needs factory_supervisor (requires a newer gleam_otp).
lustre = ">= 5.3.4 and < 5.7.0"
formosh = { path = ".." }
rsvp = ">= 1.1.3 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 1.9.2 and < 2.0.0"
