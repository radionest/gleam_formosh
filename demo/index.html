<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosh — JSON Schema, rendered live</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ── Design tokens ──────────────────────────────────────────────
           Palette grounded in the Gleam ecosystem Formosh lives in:
           faff-pink + violet-ink on lavender paper. Deliberately none of
           the stock AI looks (purple SaaS gradient / cream+serif). */
        :root {
            --ink:        #1B1A2E;
            --ink-soft:   #3A3650;
            --faff:       #FFAFF3;   /* Gleam's signature pink — fills, shadows */
            --faff-deep:  #FF8DEC;
            --magenta:    #D6298E;   /* contrast-safe pink — ink, lines, accents */
            --magenta-ink:#B81E76;
            --paper:      #F5F2F7;
            --surface:    #FFFFFF;
            --surface-2:  #FBFAFD;
            --line:       #E7E2EE;
            --line-strong:#D6CFE2;
            --muted:      #6E6A7C;
            --ok:         #1F8F54;  --ok-bg:#E8F6EE;  --ok-line:#B7E3C7;
            --danger:     #CF3B3B;  --danger-bg:#FBEBEB; --danger-line:#F0C4C4;

            --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
            --font-body:    "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

            --shadow-pop: 4px 4px 0 0 var(--faff);
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            color: var(--ink);
            background-color: var(--paper);
            /* faint graph-paper dots — evokes schema structure, stays quiet */
            background-image: radial-gradient(circle at 1px 1px, rgba(27, 26, 46, 0.05) 1px, transparent 0);
            background-size: 22px 22px;
            min-height: 100vh;
            line-height: 1.5;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: clamp(22px, 5vw, 56px) clamp(16px, 5vw, 40px) clamp(48px, 8vw, 88px);
        }

        /* ── Masthead: the page introduces itself AS a Formosh field ───── */
        .masthead { margin-bottom: clamp(30px, 6vw, 52px); }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--magenta-ink);
        }
        .eyebrow .diamond { color: var(--faff-deep); font-size: 0.7em; }

        .wordmark {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(2.7rem, 12vw, 4.8rem);
            line-height: 0.92;
            letter-spacing: -0.035em;
            color: var(--ink);
            margin: 10px 0 0;
        }
        .wordmark-dot { color: var(--magenta); }

        .field-shell {
            position: relative;
            max-width: 540px;
            margin-top: clamp(22px, 5vw, 30px);
            padding: 18px 18px 16px;
            background: var(--surface);
            border: 1.5px solid var(--ink);
            border-radius: var(--radius);
            box-shadow: 5px 5px 0 0 var(--faff);
        }
        .field-shell-label {
            position: absolute;
            top: -9px;
            left: 14px;
            padding: 0 7px;
            background: var(--surface);
            font-family: var(--font-mono);
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .field-value {
            font-size: clamp(1.05rem, 3.8vw, 1.42rem);
            font-weight: 500;
            line-height: 1.32;
            color: var(--ink);
        }
        .caret {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            margin-left: 4px;
            vertical-align: -0.16em;
            background: var(--magenta);
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

        /* ── Section heads: labels encode role (source / output) ───────── */
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin: clamp(36px, 7vw, 56px) 0 18px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid var(--line-strong);
        }
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-mono);
            font-size: 0.76rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink);
        }
        .section-mark {
            width: 9px; height: 9px;
            background: var(--faff);
            border: 1.5px solid var(--ink);
        }
        .section-note {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
        }

        /* ── Schema catalogue (the source side) ────────────────────────── */
        .schema-list {
            display: grid;
            /* min(100%, …) guarantees columns never exceed the viewport */
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
            gap: clamp(10px, 2vw, 14px);
        }
        .schema-button {
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0;
            padding: 14px 16px;
            text-align: left;
            font-family: var(--font-body);
            background: var(--surface);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }
        .schema-button:hover {
            border-color: var(--magenta);
            box-shadow: 3px 3px 0 0 var(--faff);
            transform: translateY(-1px);
        }
        .schema-button:focus-visible {
            outline: none;
            border-color: var(--magenta);
            box-shadow: 0 0 0 3px rgba(214, 41, 142, 0.25);
        }
        .schema-button.selected {
            background: var(--ink);
            border-color: var(--ink);
            box-shadow: var(--shadow-pop);
        }
        .schema-file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
        }
        .schema-file {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--magenta-ink);
            overflow-wrap: anywhere;
        }
        .schema-go {
            flex-shrink: 0;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--muted);
        }
        .schema-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            color: var(--ink);
        }
        .schema-button.selected .schema-file { color: var(--faff); }
        .schema-button.selected .schema-name { color: var(--surface); }
        .schema-button.selected .schema-go   { color: var(--faff); }

        /* ── Status banners ────────────────────────────────────────────── */
        .error-message {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            margin: 22px 0;
            padding: 14px 16px;
            background: var(--danger-bg);
            border: 1px solid var(--danger-line);
            border-radius: 12px;
            color: #8E2A2A;
            font-size: 0.92rem;
        }
        .error-mark {
            flex-shrink: 0;
            width: 22px; height: 22px;
            display: grid; place-items: center;
            background: var(--danger);
            color: #fff;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-weight: 700;
        }
        .form-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin: 22px 0;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
        }
        .form-status.success { background: var(--ok-bg);     border: 1px solid var(--ok-line);     color: #176B3C; }
        .form-status.error   { background: var(--danger-bg); border: 1px solid var(--danger-line); color: #8E2A2A; }
        .clear-button {
            flex-shrink: 0;
            display: grid; place-items: center;
            width: 28px; height: 28px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: inherit;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.55;
            transition: opacity 0.15s ease, background 0.15s ease;
        }
        .clear-button:hover { opacity: 1; background: rgba(0, 0, 0, 0.06); }

        /* ── Workbench: the rendered-output surface ────────────────────── */
        .workbench {
            margin-top: clamp(30px, 6vw, 52px);
            background: var(--surface);
            border: 1.5px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 48px -34px rgba(27, 26, 46, 0.45);
        }
        /* transform bar = window titlebar that states the value prop */
        .transform-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px clamp(14px, 4vw, 22px);
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .tb-file { color: var(--faff); min-width: 0; overflow-wrap: anywhere; }
        .tb-arrow { color: var(--surface); font-weight: 700; }
        .tb-out {
            margin-left: auto;
            padding: 3px 10px;
            background: var(--faff);
            color: var(--ink);
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }
        .workbench-body { padding: clamp(18px, 4vw, 30px); }

        .info-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: clamp(18px, 4vw, 26px);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--ink);
        }
        .chip-key { color: var(--muted); }

        .placeholder {
            margin-top: clamp(30px, 6vw, 52px);
            padding: clamp(44px, 11vw, 76px) 24px;
            text-align: center;
            color: var(--muted);
            background: var(--surface);
            border: 1.5px dashed var(--line-strong);
            border-radius: 16px;
        }
        .placeholder-mark {
            display: inline-block;
            margin-bottom: 14px;
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--faff-deep);
        }

        /* ── Two-pane workbench: form beside its source schema ─────────── */
        .workbench.two-pane {
            /* Break out of the 960px column by widening symmetrically around the
               .page (which margin:auto centers within the scrollbar-excluded body),
               so the centering never depends on 100vw counting the scrollbar.
               --bleed = extra width per side, capped to never exceed 1240px total
               nor the viewport (the 32px keeps clear of a classic scrollbar). */
            --bleed: max(0px, min(
                calc((1240px - 100%) / 2),
                calc((100vw - 100% - 32px) / 2)
            ));
            width: calc(100% + 2 * var(--bleed));
            margin-inline: calc(-1 * var(--bleed));
        }
        .split {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: clamp(16px, 3vw, 28px);
            align-items: start;
        }
        /* Below this width the two panes stack, form first. */
        @media (max-width: 900px) {
            .split { grid-template-columns: minmax(0, 1fr); }
            .workbench.two-pane {
                width: auto;
                margin-inline: 0;
            }
        }

        .schema-pane {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }
        .code-block {
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface-2);
        }
        .code-label {
            padding: 8px 14px;
            background: var(--ink);
            color: var(--faff);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        textarea.code-editor {
            margin: 0;
            padding: 14px 16px;
            height: 360px;
            resize: vertical;
            border: 0;
            outline: none;
            background: transparent;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.55;
            color: var(--ink-soft);
            white-space: pre;
            tab-size: 2;
        }
        .code-block:focus-within { border-color: var(--magenta); }
        .code-note {
            padding: 8px 14px;
            border-top: 1px solid var(--line);
            font-size: 0.78rem;
            color: var(--muted);
        }
        .code-note.error { color: var(--danger); background: var(--danger-bg); }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
            .caret { animation: none; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { main } from "./build/dev/javascript/demo/demo.mjs";
        main();
    </script>
</body>
</html>
