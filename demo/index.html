<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosh Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        h2 {
            color: #555;
            margin: 30px 0 20px;
            font-size: 1.5em;
        }

        .schema-selector {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .schema-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .schema-button {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .schema-button:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .schema-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .form-container {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #666;
            font-size: 0.95em;
        }

        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .schema-preview {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .schema-preview pre {
            margin: 0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .action-box {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .action-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* ── Swipe-review widget (Phase B styles) ─────────────────────
           Auto-adopted into the <formosh-form> open shadow root, so plain
           [part="…"] selectors reach the widget's elements. */
        formosh-form { display: block; }

        [part="swipe-review"] {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 560px;
            margin: 0 auto;
        }

        [part="swipe-progress"] {
            position: sticky;
            top: 0;
            z-index: 2;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            color: #333;
            background: #f1f3f8;
            padding: 10px;
            border-radius: 10px;
        }

        [part="swipe-regions"],
        [part="swipe-region-group"],
        [part="swipe-zones"] {
            display: flex;
            flex-direction: column;
        }
        [part="swipe-regions"] { gap: 22px; }
        [part="swipe-region-group"] { gap: 10px; }
        [part="swipe-zones"] { gap: 10px; }

        [part="swipe-region"] {
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #667eea;
            padding-bottom: 4px;
            border-bottom: 2px solid #e6e9ff;
        }

        [part="swipe-row"] {
            background: #fff;
            border: 1px solid #e8e8ef;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        [part="swipe-zone-title"] {
            font-size: 1.05em;
            font-weight: 600;
            color: #2b2b35;
        }

        [part="swipe-choices"] { display: flex; gap: 8px; }

        [part="swipe-choice"] {
            flex: 1;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.15s ease;
        }
        [part="swipe-choice"]:active { transform: scale(0.97); }
        [part="swipe-choice"]:hover { filter: brightness(1.05); }
        [part="swipe-choice"][data-tone="danger"] { background: #e5484d; }
        [part="swipe-choice"][data-tone="ok"]     { background: #30a46c; }
        [part="swipe-choice"][data-tone="muted"]  { background: #8b8d98; }

        [part="swipe-controls"] {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            bottom: 0;
            background: #f1f3f8;
            padding: 10px 0;
        }
        [part="swipe-undo"],
        [part="swipe-fill"] {
            min-height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #cfd2e0;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        [part="swipe-fill"] { flex: 1; }

        [part="swipe-review-summary"] {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        [part="swipe-review-title"] {
            font-size: 1.3em;
            font-weight: 700;
            text-align: center;
            color: #30a46c;
        }
        [part="swipe-review-list"] {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        [part="swipe-review-row"] {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 1px solid #e8e8ef;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 0.95em;
        }
        [part="swipe-review-zone"] { color: #2b2b35; }
        [part="swipe-review-answer"] { font-weight: 700; color: #667eea; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { main } from "./build/dev/javascript/demo/demo.mjs";
        main();
    </script>
</body>
</html>
