name: Deploy demo to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Build demo
        working-directory: demo
        run: |
          gleam deps download
          gleam build --target javascript

      # The demo is a separate Gleam project, so root test.yml never runs its
      # tests. Run them here (build-only on PRs still catches breakage).
      - name: Test demo
        working-directory: demo
        run: |
          gleam test
          gleam format --check src test

      - name: Assemble site
        run: |
          mkdir -p _site/build/dev
          cp demo/index.html demo/form-theme.css _site/
          cp -r demo/schemas _site/
          cp -r demo/build/dev/javascript _site/build/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only publish from main; on pull_request we build-only to catch breakage.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
